syntax = "proto3";

package agentic.v1;

import "google/protobuf/timestamp.proto";

// Internal task lifecycle contract.
//
// Rust remains the durable task authority and must authenticate the caller,
// resolve tenant membership, enforce authorization, and persist the task.
// Authentication is carried in gRPC metadata, for example:
// authorization: Bearer <internal-token>
service TaskService {
  // Unary RPC to create one tenant-scoped task.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
  Priority priority = 3;
  string assignee_id = 4;
  google.protobuf.Timestamp due_date = 5;
}

message CreateTaskResponse {
  string task_id = 1;
  string status = 2;
  google.protobuf.Timestamp created_at = 3;
}
