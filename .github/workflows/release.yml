name: release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_VERSION: v3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build release binary
        run: |
          docker build -f Dockerfile.ci -t agentic-ci .
          docker run --rm -v "$PWD:/src" -w /src agentic-ci cargo build --release

      - name: Generate SBOM with Syft
        run: |
          docker run --rm -v "$PWD:/src" -w /src anchore/syft:latest \
            scan dir:. -o spdx-json=/src/sbom.spdx.json

      - name: Generate SLSA-style provenance predicate
        run: |
          BINARY=target/release/rust-control-plane
          BINARY_SHA=$(sha256sum "$BINARY" | cut -d' ' -f1)
          LOCK_SHA=$(sha256sum Cargo.lock | cut -d' ' -f1)
          jq -n \
            --arg name "rust-control-plane" \
            --arg binarySha "$BINARY_SHA" \
            --arg lockSha "$LOCK_SHA" \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg ref "$GITHUB_REF" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            '{
              _type: "https://in-toto.io/Statement/v1",
              subject: [{name: $name, digest: {sha256: $binarySha}}],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {
                buildDefinition: {
                  buildType: "https://github.com/actions/runner",
                  externalParameters: {
                    repository: $repository,
                    ref: $ref,
                    workflow: $workflow
                  },
                  internalParameters: {
                    github_run_id: $runId
                  },
                  resolvedDependencies: [
                    {
                      uri: ("git+" + $repository + "@" + $commit),
                      digest: {gitCommit: $commit}
                    },
                    {
                      uri: "pkg:cargo/lockfile",
                      digest: {sha256: $lockSha}
                    }
                  ]
                },
                runDetails: {
                  builder: {
                    id: ($repository + "/actions/runs/" + $runId)
                  },
                  metadata: {
                    invocationId: ($repository + "/actions/runs/" + $runId)
                  }
                }
              }
            }' > provenance.json

      - name: Install cosign
        run: |
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Sign binary and provenance with cosign keyless
        run: |
          cosign sign-blob --yes \
            --bundle rust-control-plane.sigstore.json \
            target/release/rust-control-plane
          cosign attest-blob --yes \
            --type slsaprovenance1 \
            --predicate provenance.json \
            --bundle rust-control-plane.attestation.sigstore.json \
            target/release/rust-control-plane

      - name: Verify signatures
        env:
          IDENTITY_REGEX: ^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*$
        run: |
          cosign verify-blob \
            --bundle rust-control-plane.sigstore.json \
            --certificate-identity-regexp "$IDENTITY_REGEX" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            target/release/rust-control-plane
          cosign verify-blob-attestation \
            --bundle rust-control-plane.attestation.sigstore.json \
            --type slsaprovenance1 \
            --certificate-identity-regexp "$IDENTITY_REGEX" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            target/release/rust-control-plane

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            target/release/rust-control-plane \
            sbom.spdx.json \
            provenance.json \
            rust-control-plane.sigstore.json \
            rust-control-plane.attestation.sigstore.json \
            --clobber
