name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.
        Never include real credentials, internal hosts, or private IPs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, and environment details.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or 0123456"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, credentials, and internal addresses.
      render: shell
    validations:
      required: false
