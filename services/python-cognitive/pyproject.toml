[project]
name = "python-cognitive"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4.25",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.3", "mypy>=1.8"]
